[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "data-processor"
version = "0.1.0"
description = "Laboratory work 2: Data structures and functional decomposition in Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Danylo Harbich", email = "danul.harbich@lnu.edu.ua" }
]
keywords = ["data-structures", "python", "collections", "decomposition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
data-processor = "data_processor.main:main"
